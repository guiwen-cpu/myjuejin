upstream web_upstream {
  server web:3000;
}

upstream api_upstream {
  server api:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
map $uri $error_lang {
  ~^/en(/|$) en;
  default zh;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  client_max_body_size 10m;

  # 自定义错误页：404 与 5xx 由 nginx 本地静态页提供（见 deploy/errors/）
  error_page 404 =404 /errors/$error_lang/404.html;
  error_page 502 =502 /errors/$error_lang/5xx.html;
  error_page 503 =503 /errors/$error_lang/5xx.html;
  error_page 504 =504 /errors/$error_lang/5xx.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

  # API 直连后端
  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  # Nuxt 构建产物（带 hash），CDN/浏览器长缓存
  location /_nuxt/ {
    proxy_pass http://web_upstream;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # 其余全部交给 Nuxt（SSR + SWR 缓存）
  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 错误页静态目录（挂载自 deploy/errors/）
  location /errors/ {
    alias /usr/share/nginx/html/errors/;
    add_header Cache-Control "no-cache";
    default_type text/html;
  }
}

