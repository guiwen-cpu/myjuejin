services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    ports:
      # 仅绑定本机回环地址：给本地开发用（本机 pnpm dev 的 API 需要连）
      # 不绑定 0.0.0.0，避免对外暴露数据库端口
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devflow]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devflow]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devflow-meili-master-key}
      MEILI_ENV: production
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    networks: [devflow]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-devflow}:${POSTGRES_PASSWORD:-change-me-strong-password}@postgres:5432/${POSTGRES_DB:-devflow}?schema=public
      REDIS_URL: redis://redis:6379
      # 默认值仅供本地开发快速上手；生产部署务必在 .env 里覆盖为强随机值
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-devflow-access-secret-change-me}
      ACCESS_TOKEN_TTL_SECONDS: "1800"
      REFRESH_TOKEN_TTL_SECONDS: "604800"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devflow-meili-master-key}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: "5"
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-}
    volumes:
      - uploaddata:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [devflow]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:3000
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - api
    networks: [devflow]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks: [devflow]

  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks: [devflow]

volumes:
  pgdata:
  redisdata:
  meilidata:
  uploaddata:
  certbot-www:
  certbot-certs:

networks:
  devflow:
    driver: bridge
